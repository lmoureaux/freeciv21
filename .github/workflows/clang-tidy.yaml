# This action pushes the output of clang-tidy to Codacy
# See https://github.com/codacy/codacy-clang-tidy

name: clang-tidy-review
on:
  pull_request_target:
    types: [review_requested]

jobs:
  build:
    name: clang-tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install Codacy Tools
        run: |
          wget -O codacy-clang-tidy https://github.com/codacy/codacy-clang-tidy/releases/download/1.3.3/codacy-clang-tidy-linux-1.3.3
          chmod +x codacy-clang-tidy

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install \
            clang \
            cmake \
            ninja-build \
            python3 \
            gettext \
            qtbase5-dev \
            libqt5svg5-dev \
            libkf5archive-dev \
            liblua5.3-dev \
            libsqlite3-dev \
            libsdl2-mixer-dev
          export CC=$(which clang)
          export CXX=$(which clang++)

      - name: Configure
        run: |
          cmake . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Run clang-tidy
        run: |
          run-clang-tidy -p build client/tilespec.cpp | ./codacy-clang-tidy >report.json

      - name: Upload Results
        env:
          COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          curl -XPOST -L -H "project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}" \
            -H "Content-type: application/json" -d @- \
            "https://api.codacy.com/2.0/commit/$COMMIT/issuesRemoteResults" \
            <report.json

          curl -XPOST -L -H "project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}" \
            -H "Content-type: application/json" \
            "https://api.codacy.com/2.0/commit/$COMMIT/resultsFinal"
